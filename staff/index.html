<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>New Home | إدارة مالية</title><meta name="theme-color" content="#1c2420"><style>
:root{--ink:#1c2420;--brand:#3e4f46;--gold:#b9975b;--paper:#f5f5f1;--muted:#68726d;--line:#dfe3df;--red:#a33c35;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);min-height:100vh}button,input,select,textarea{font:inherit}.shell{width:min(1100px,100%);margin:auto;padding:20px}.auth{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 0,#63766a,transparent 40%),var(--ink)}.login{width:min(430px,calc(100% - 32px));padding:32px;background:#fff;border-radius:24px;box-shadow:0 25px 80px #0006}.brand{font-family:Georgia,serif;font-size:28px;margin:0 0 6px}.brand b{color:var(--brand)}.sub{color:var(--muted);margin:0 0 24px}.field{display:grid;gap:7px;margin:13px 0;font-size:14px;font-weight:600}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff;color:var(--ink)}.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid #b8cbbd;border-color:var(--brand)}.btn{border:0;border-radius:13px;padding:14px 18px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55}.btn.gold{background:var(--gold);color:#201b12}.btn.ghost{background:#e9ede9;color:var(--ink)}.wide{width:100%}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 26px}.user{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px}.metric small{color:var(--muted);display:block}.metric strong{font-size:23px;display:block;margin-top:6px}.section{margin-top:22px}.section h2{font-size:19px;margin:0 0 12px}.items{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.item small{color:var(--muted);display:block}.tag{font-size:12px;background:#edf2ee;color:var(--brand);padding:5px 9px;border-radius:99px;white-space:nowrap}.tag.pending{background:#fff0d5;color:#8a5900}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{padding:9px 12px;font-size:13px}.expense{max-width:650px;margin:auto}.receipt{border:1px dashed #9daf9f;background:#fafcf9;padding:13px;border-radius:12px}.notice{background:#e8f2e9;color:#295738;padding:11px 14px;border-radius:12px;margin:12px 0}.error{background:#fce8e6;color:#932f29;padding:11px 14px;border-radius:12px;margin:12px 0}.hide{display:none!important}@media(max-width:720px){.shell{padding:16px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:14px}.metric strong{font-size:19px}.top{align-items:flex-start}.top .brand{font-size:22px}.item{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.add{position:fixed;bottom:18px;left:16px;right:16px;z-index:2;box-shadow:0 12px 28px #1c242055}.engineer-view{padding-bottom:78px}}
</style></head><body><main id="app"></main><script>
const app=document.querySelector('#app'),api='/api';let me,projects=[];const egp=x=>new Intl.NumberFormat('ar-EG',{style:'currency',currency:'EGP',maximumFractionDigits:2}).format((x||0)/100);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
async function call(path,opts={}){let r=await fetch(api+path,{credentials:'same-origin',...opts,headers:{...(opts.body instanceof FormData?{}:{'content-type':'application/json'}),...(opts.headers||{})}});let d=r.headers.get('content-type')?.includes('json')?await r.json():null;if(!r.ok)throw Error(d?.error||'تعذر تنفيذ الطلب');return d}
function login(message=''){app.innerHTML=`<section class="auth"><form class="login" id="login"><h1 class="brand">New <b>Home</b></h1><p class="sub">النظام المالي الداخلي</p>${message?`<p class="error">${esc(message)}</p>`:''}<label class="field">اسم المستخدم<input name="username" autocomplete="username" required autofocus></label><label class="field">كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label><button class="btn wide">دخول آمن</button></form></section>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;try{let x=await call('/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});me=x.user;await home()}catch(x){login(x.message)}}}
function headerBar(){return `<header class="top"><div><h1 class="brand">New <b>Home</b></h1><span class="user">${esc(me.name)} · ${me.role==='admin'?'الإدارة':'مهندس'}</span></div><button id="out" class="btn ghost">خروج</button></header>`}
function status(s){return `<span class="tag ${s==='pending'?'pending':''}">${({pending:'بانتظار المراجعة',approved:'معتمد',rejected:'مرفوض',returned:'مطلوب تعديل',cancellation_requested:'طلب إلغاء',cancelled:'ملغي'})[s]||s}</span>`}
async function home(){let d=await call('/dashboard');if(me.role==='engineer')engineer(d);else admin(d);document.querySelector('#out').onclick=async()=>{await call('/auth/logout',{method:'POST'});login()}}
async function engineer(d){projects=(await call('/projects')).projects;let single=projects.length===1;app.innerHTML=`<div class="shell engineer-view">${headerBar()}<div class="grid"><article class="card metric"><small>الرصيد الفعلي للعهدة</small><strong>${egp(d.balance.actual_piastres)}</strong></article><article class="card metric"><small>مصروفات قيد المراجعة</small><strong>${egp(d.balance.pending_piastres)}</strong></article><article class="card metric"><small>الرصيد المتوقع</small><strong>${egp(d.balance.estimated_piastres)}</strong></article><article class="card metric"><small>المشاريع المسندة</small><strong>${projects.length}</strong></article></div><section class="section"><h2>آخر المصروفات</h2><div class="items">${d.expenses.length?d.expenses.map(x=>`<article class="item"><div><b>${esc(x.project_name)}</b><small>${esc(x.category)} · ${new Date(x.submitted_at).toLocaleDateString('ar-EG')}</small></div><div><b>${egp(x.amount_piastres)}</b>${status(x.status)}</div></article>`).join(''):'<article class="card">لا توجد مصروفات مسجلة بعد.</article>'}</div></section><button id="add" class="btn add">＋ إضافة مصروف</button></div>`;document.querySelector('#add').onclick=expenseForm}
function expenseForm(){app.innerHTML=`<div class="shell expense">${headerBar()}<h2>تسجيل مصروف</h2><p class="sub">خذ صورة الإيصال ثم أرسل المصروف للمراجعة.</p><form id="expense"><label class="field">المشروع<select name="project_id" required>${projects.map(p=>`<option value="${p.id}" ${projects.length===1?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label class="field">المبلغ بالجنيه<input name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" required autofocus></label><label class="field">التصنيف<select name="category_id" required><option value="materials">مواد ومشتريات</option><option value="transport">مواصلات</option><option value="labor">عمالة وأجور</option><option value="equipment">معدات وأدوات</option><option value="other">مصروفات أخرى</option></select></label><label class="field">وصف مختصر <input name="description" maxlength="500" placeholder="اختياري"></label><label class="field receipt">صورة/صور الإيصال <input name="receipts" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" multiple></label><label class="field"><input id="noReceipt" type="checkbox"> لا يوجد إيصال</label><label id="reason" class="field hide">سبب عدم وجود إيصال <input name="no_receipt_reason" maxlength="300"></label><div id="msg"></div><button class="btn wide">إرسال المصروف للمراجعة</button><button id="back" type="button" class="btn ghost wide">رجوع</button></form></div>`;document.querySelector('#out').onclick=async()=>{await call('/auth/logout',{method:'POST'});login()};document.querySelector('#back').onclick=home;document.querySelector('#noReceipt').onchange=e=>document.querySelector('#reason').classList.toggle('hide',!e.target.checked);document.querySelector('#expense').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;let f=new FormData(e.target);f.append('submission_key',crypto.randomUUID());try{let x=await call('/expenses',{method:'POST',body:f});document.querySelector('#msg').innerHTML=`<p class="notice">تم الإرسال بنجاح. رقم المصروف: ${esc(x.expense.public_id)}</p>`;e.target.reset()}catch(x){document.querySelector('#msg').innerHTML=`<p class="error">${esc(x.message)}</p>`}finally{b.disabled=false}}}
async function admin(d){let o=d.overview,opt=await call('/admin/options'),select=(a,label)=>`<option value="">${label}</option>${a.map(x=>`<option value="${x.id}">${esc(x.name||x.display_name)}${x.client_name?' — '+esc(x.client_name):''}</option>`).join('')}`,forms=`<section class="section"><h2>إدارة سريعة</h2><div class="grid"><form class="card manage" data-url="/users"><b>إضافة مهندس</b><label class="field">الاسم<input name="display_name" required></label><label class="field">اسم الدخول<input name="username" required></label><label class="field">كلمة مرور مؤقتة<input name="password" type="password" minlength="12" required></label><button class="btn wide">حفظ المهندس</button></form><form class="card manage" data-url="/clients"><b>إضافة عميل</b><label class="field">الاسم<input name="name" required></label><label class="field">الموبايل<input name="phone" required></label><label class="field">البريد<input name="email" type="email"></label><button class="btn wide">حفظ العميل</button></form><form class="card manage" data-url="/projects"><b>إضافة مشروع</b><label class="field">العميل<select name="client_id" required>${select(opt.clients,'اختر العميل')}</select></label><label class="field">اسم المشروع<input name="name" required></label><label class="field">قيمة التعاقد (جنيه)<input name="contract_piastres" type="number" min="0" value="0"></label><label class="field">العنوان<input name="address"></label><button class="btn wide">حفظ المشروع</button></form><form class="card manage" data-url="/payments"><b>تسجيل دفعة عميل</b><label class="field">المشروع<select name="project_id" required>${select(opt.projects,'اختر المشروع')}</select></label><label class="field">المبلغ (جنيه)<input name="amount" type="number" min="0.01" step="0.01" required></label><label class="field">التاريخ<input name="paid_on" type="date" required></label><button class="btn wide">تسجيل الدفعة</button></form><form class="card manage" data-url="/advances"><b>تسليم / استرداد عهدة</b><label class="field">المهندس<select name="engineer_id" required>${select(opt.engineers,'اختر المهندس')}</select></label><label class="field">النوع<select name="kind"><option value="handover">تسليم عهدة</option><option value="return">استرداد نقدية</option></select></label><label class="field">المبلغ (جنيه)<input name="amount" type="number" min="0.01" step="0.01" required></label><label class="field">التاريخ<input name="occurred_on" type="date" required></label><button class="btn wide">تأكيد العملية</button></form><form class="card manage" data-assign="1"><b>إسناد مشروع لمهندس</b><label class="field">المشروع<select name="project_id" required>${select(opt.projects,'اختر المشروع')}</select></label><label class="field">المهندس<select name="engineer_id" required>${select(opt.engineers,'اختر المهندس')}</select></label><button class="btn wide">إسناد المشروع</button></form></div></section>`;app.innerHTML=`<div class="shell">${headerBar()}<div class="grid"><article class="card metric"><small>مشاريع نشطة</small><strong>${o.active_projects}</strong></article><article class="card metric"><small>عملاء</small><strong>${o.clients}</strong></article><article class="card metric"><small>دفعات العملاء</small><strong>${egp(o.payments)}</strong></article><article class="card metric"><small>مصروفات معتمدة</small><strong>${egp(o.expenses)}</strong></article><article class="card metric"><small>مستحق من العملاء</small><strong>${egp(o.outstanding)}</strong></article><article class="card metric"><small>مصروفات للمراجعة</small><strong>${o.pending_expenses}</strong></article><article class="card metric"><small>طلبات عهدة</small><strong>${o.pending_advances}</strong></article><article class="card metric"><small>طلبات إلغاء</small><strong>${o.pending_cancellations}</strong></article></div>${forms}<section class="section"><h2>طابور اعتماد المصروفات</h2><div class="items">${d.queue.length?d.queue.map(x=>`<article class="item"><div><b>${esc(x.engineer)} — ${esc(x.project)}</b><small>${esc(x.category)} · ${new Date(x.submitted_at).toLocaleString('ar-EG')}</small><small>${esc(x.public_id)}</small></div><div><b>${egp(x.amount_piastres)}</b><div class="actions"><button class="btn gold" data-a="approve" data-i="${x.id}">اعتماد</button><button class="btn ghost" data-a="reject" data-i="${x.id}">رفض</button><button class="btn ghost" data-a="return" data-i="${x.id}">تصحيح</button></div></div></article>`).join(''):'<article class="card">لا توجد مصروفات معلقة.</article>'}</div></section><section class="section"><h2>تقارير</h2><div class="actions"><a class="btn" href="/api/reports/expenses.xlsx">تنزيل تفاصيل المصروفات Excel</a><a class="btn ghost" href="/api/reports/expenses.csv">CSV</a></div></section></div>`;document.querySelector('#out').onclick=async()=>{await call('/auth/logout',{method:'POST'});login()};document.querySelectorAll('.manage').forEach(f=>f.onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;try{let data=Object.fromEntries(new FormData(f));let path=f.dataset.assign?`/projects/${data.project_id}/assignments`:f.dataset.url;await call(path,{method:'POST',body:JSON.stringify(data)});alert('تم الحفظ بنجاح');home()}catch(x){alert(x.message);b.disabled=false}});document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{let action=b.dataset.a,note='';if(action!=='approve'){note=prompt(action==='reject'?'سبب الرفض (مطلوب):':'ملاحظة التصحيح (مطلوبة):')||'';if(!note)return}b.disabled=true;try{await call(`/expenses/${b.dataset.i}/decision`,{method:'POST',body:JSON.stringify({action,note})});home()}catch(x){alert(x.message);b.disabled=false}})}
// Render the login immediately. The background session check only replaces it
// when a valid, active session already exists.
login();
(async()=>{try{let x=await call('/auth/me');me=x.user;await home()}catch{/* Login form is already visible. */}})();
</script></main></body></html>
